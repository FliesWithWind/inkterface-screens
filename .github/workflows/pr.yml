name: PR validation

# Runs on pull_request (NOT pull_request_target): the workflow uses the PR's own code but needs
# no secrets, so it must never run with the base repo's token and secrets against fork code.
#
# Self-contained: the plugin's validator/renderer is vendored at vendor/inkterface_core (see
# vendor/README.md), so CI never checks out the plugin repo.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the catalog
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # validate.py --base needs the base commit for the diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Pillow
        run: pip install pillow==13.0.0

      - name: Verify the vendored plugin copy
        run: python tools/check_vendor.py

      - name: Validate changed screens
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python tools/validate.py --base "origin/${BASE_REF}"

      - name: Run the catalog tests
        run: python -m pytest tests -q -p no:cacheprovider
